# Cloudflare Python Worker build metadata (repo root = pywrangler project).
# Docker is unaffected: backend/Dockerfile installs backend/requirements.txt
# and ignores this file. `uv run pywrangler deploy` bundles THESE deps.
[project]
name = "prime-nest-business-platform"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "PyJWT>=2.8,<3.0",
  "email-validator>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "pg8000>=1.30,<2.0",
  # Argon2 gate (Prompt 2 §2): included so the Worker runtime gets a fair
  # trial of the EXISTING pwdlib/argon2 hashing. If the Pyodide/Workers
  # build cannot provide it, this dep is removed and Docker remains the
  # auth system of record — hashing itself is NEVER changed.
  "pwdlib[argon2]>=0.2,<1.0",
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
]
