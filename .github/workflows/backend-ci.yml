name: backend-ci
on:
  push:
    branches: [main]
    paths: ["backend/**", "deploy/**", "scripts/**"]
  pull_request:
    paths: ["backend/**"]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: python scripts/verify/forwarding_contract.py --api http://localhost:8000
        if: false # runs post-deploy against real env, not in unit CI
