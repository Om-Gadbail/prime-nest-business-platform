[project]
# Cloudflare Python Workers build metadata (Docker is unaffected: the
# Dockerfile installs backend/requirements.txt and ignores this section).
# Workers runtime requires Python >= 3.13; Docker image uses 3.12-slim.
# Both satisfy ">=3.12" so neither toolchain rejects the package.
name = "prime-nest-business-platform"
version = "0.1.0"
requires-python = ">=3.12"
# Edge-compatible subset. Native/TCP Docker-only deps (psycopg[binary],
# redis, pwdlib[argon2], uvicorn[standard], alembic) are VPS/Docker-only and
# are intentionally NOT listed for the Worker build — see
# docs/CLOUDFLARE_COMPATIBILITY.md. pg8000 (pure Python, sync) is the
# Hyperdrive driver for the Worker edge (sync SQLAlchemy only — async is
# unsupported on Python Workers). pwdlib/argon2 stays Docker-only until the
# Argon2 Worker gate is proven (see cutover report).
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "PyJWT>=2.8,<3.0",
  "email-validator>=2.0,<3.0",
  "httpx>=0.27,<1.0",
  "pg8000>=1.30,<2.0",
]

[dependency-groups]
# Cloudflare local-dev toolchain (official FastAPI-on-Workers quickstart).
dev = [
  "workers-py",
  "workers-runtime-sdk",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE"]
ignore = [
  # B008: `Depends(...)` in parameter defaults is the canonical FastAPI
  # dependency-injection idiom, not an eager-call bug.
  "B008",
  # B009: `_user_out` deliberately uses defensive getattr() reads so auth
  # responses work uniformly with ORM objects and test doubles.
  "B009",
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves relationship string annotations ("BusinessMembership",
# ...) via its class registry at mapper-configuration time, and every model
# module uses `from __future__ import annotations` (lazy evaluation), so
# these F821 hits are linter false positives, not runtime NameErrors.
"app/models/*.py" = ["F821"]
# Block 2/3/4 tests import fixtures (b2, login_as, ...) from block2_support for
# pytest registration AND take them as parameters — F811 by design.
"tests/test_block*.py" = ["F811"]
# Prompt 8 regression suite follows the same fixture-reuse convention.
"tests/test_prompt8_security.py" = ["F811"]
