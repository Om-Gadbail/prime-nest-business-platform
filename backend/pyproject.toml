[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE"]
ignore = [
  # B008: `Depends(...)` in parameter defaults is the canonical FastAPI
  # dependency-injection idiom, not an eager-call bug.
  "B008",
  # B009: `_user_out` deliberately uses defensive getattr() reads so auth
  # responses work uniformly with ORM objects and test doubles.
  "B009",
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves relationship string annotations ("BusinessMembership",
# ...) via its class registry at mapper-configuration time, and every model
# module uses `from __future__ import annotations` (lazy evaluation), so
# these F821 hits are linter false positives, not runtime NameErrors.
"app/models/*.py" = ["F821"]
# Block 2/3/4 tests import fixtures (b2, login_as, ...) from block2_support for
# pytest registration AND take them as parameters — F811 by design.
"tests/test_block*.py" = ["F811"]
# Prompt 8 regression suite follows the same fixture-reuse convention.
"tests/test_prompt8_security.py" = ["F811"]
