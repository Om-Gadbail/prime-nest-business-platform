# Production compose — VPS (Neon is the database; no local Postgres here).
# Backend/worker/scheduler are the EXISTING sync FastAPI app. FastAPI listens
# on 127.0.0.1:8000 equivalent inside the compose network; cloudflared
# exposes it via the named Tunnel. Port 8000 is NEVER published publicly.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ${BACKEND_IMAGE:-prime-nest-backend:${APP_VERSION:-latest}}
    restart: "no"
    env_file:
      - .env.production
    command: ["alembic", "upgrade", "head"]

  backend:
    image: ${BACKEND_IMAGE:-prime-nest-backend:${APP_VERSION:-latest}}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: ${BACKEND_IMAGE:-prime-nest-backend:${APP_VERSION:-latest}}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env.production

  scheduler:
    image: ${BACKEND_IMAGE:-prime-nest-backend:${APP_VERSION:-latest}}
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env.production

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN}"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

volumes:
  redisdata:
